<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse all 16 cultural and sports events at COLORIDO 2K26 — R.V.R. & J.C. College of Engineering, Guntur." />
    <title>Events — COLORIDO 2K26</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
</head>
  <body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="site-header"></div>

    <main id="main-content">

    <div class="page-intro">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Events</span></nav>
        <div class="section-header">
          <span class="eyebrow">Explore</span>
          <h2>Event <span class="gradient-text">Explorer</span></h2>
          <p>Discover all the cultural and sports events at COLORIDO 2K26. Filter by category or search for your favorite event.</p>
        </div>
      </div>
    </div>

    <section class="events-section" id="events">
      <div class="container">
        <div class="events-controls reveal">
          <button class="events-tab active" data-category="all">All Events</button>
          <button class="events-tab" data-category="Cultural">Cultural</button>
          <button class="events-tab" data-category="Sports">Sports</button>
        </div>
        <div class="events-search reveal">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="eventSearch" placeholder="Search events..." aria-label="Search events" />
        </div>
        <div class="events-grid stagger" id="eventsGrid"></div>
        <p id="noEvents" style="display:none; text-align:center; color: var(--color-text-muted); padding: var(--space-5) 0;">No events found. Try a different search.</p>
      </div>
    </section>

    <!-- Event Details Modal -->
    <div class="event-modal-overlay" id="eventModalOverlay">
      <div class="event-modal" id="eventModal" role="dialog" aria-modal="true" tabindex="-1"></div>
    </div>

    </main>

    <div id="site-footer"></div>

    <script type="module" src="js/pages/events.js"></script>
  </body>
</html>
